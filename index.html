<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meyve Sebze Stok Kodu Arama</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/jsbarcode.min.js"></script>
  </head>
  <body>
    <div class="wrap">
      <h1>
        🥬 Meyve Sebze Stok Kodu Arama<span
          class="version-badge"
          id="versionBadge"
        ></span>
      </h1>
      <div class="search-box">
        <input
          id="q"
          type="text"
          placeholder="Ürün adı veya kod yazın (örn: domates, 2900104)"
          autofocus
        />
        <div class="count" id="count"></div>
      </div>

      <div class="channel-box" id="channelBox"></div>

      <div class="tabs">
        <button class="tab active" data-tab="urunler">Ürünler</button>
        <button class="tab" data-tab="barkodlar">Barkodlar</button>
      </div>

      <div id="urunlerPanel">
        <div id="results"></div>
      </div>

      <div id="barkodlarPanel" style="display: none"></div>

      <div id="barcodeModal" class="modal" style="display: none">
        <div class="modal-content">
          <div class="modal-label" id="modalLabel"></div>
          <svg id="modalBarcode"></svg>
          <button id="modalClose">Kapat</button>
        </div>
      </div>

      <footer>Sürüm <span id="versionFooter"></span></footer>
    </div>

    <script src="js/app.js" defer></script>
  </body>
</html>
