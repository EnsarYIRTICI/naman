  * { box-sizing: border-box; }
  body {
    margin: 0;

    background: #f4f5f0;
    color: #1a1a1a;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 {
    font-size: 1.15rem;
    margin: 8px 0 14px;
    color: #2d4a2b;
  }
  .search-box {
    position: sticky;
    top: 0;
    background: #f4f5f0;
    padding: 8px 0 12px;
    z-index: 10;
  }
  input {
    width: 100%;
    padding: 14px 16px;
    font-size: 1.05rem;
    border: 2px solid #2d4a2b;
    border-radius: 10px;
    outline: none;
  }
  input:focus { border-color: #4a7a45; }
  .count {
    font-size: 0.85rem;
    color: #666;
    margin: 6px 2px 0;
  }
  .group-title {
    background: #2d4a2b;
    color: #fff;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.85rem;
    margin: 16px 0 6px;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border: 1px solid #e0e0dc;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 6px;
  }
  .code {
    font-weight: 700;
    color: #2d4a2b;
    font-variant-numeric: tabular-nums;
    margin-right: 12px;
    white-space: nowrap;
  }
  .name { flex: 1; }
  .empty {
    text-align: center;
    color: #999;
    padding: 30px 0;
  }
  mark {
    background: #ffe58a;
    padding: 0;
  }
</style>
</head>

function normalize(s){
  return s.toLocaleUpperCase('tr-TR')
    .replace(/İ/g,'I').replace(/I/g,'I')
    .replace(/Ş/g,'S').replace(/Ğ/g,'G')
    .replace(/Ü/g,'U').replace(/Ö/g,'O').replace(/Ç/g,'C');
}

function highlight(text, q){
  if(!q) return text;
  const idx = normalize(text).indexOf(q);
  if(idx === -1) return text;
  return text.slice(0,idx) + '<mark>' + text.slice(idx, idx+q.length) + '</mark>' + text.slice(idx+q.length);
}

const input = document.getElementById('q');
const results = document.getElementById('results');
const count = document.getElementById('count');

function render(){
  const raw = input.value.trim();
  const q = normalize(raw);
  const filtered = q ? data.filter(d => normalize(d.n).includes(q) || d.c.includes(raw)) : data;

  count.textContent = q ? `${filtered.length} sonuç bulundu` : `${data.length} ürün listeleniyor`;

  if(filtered.length === 0){
    results.innerHTML = '<div class="empty">Sonuç bulunamadı</div>';
    return;
  }

  let html = '';
  let lastGroup = null;
  filtered.forEach(d => {
    if(d.g !== lastGroup){
      html += `<div class="group-title">${d.g}</div><ul>`;
      lastGroup = d.g;
    }
    html += `<li><span class="name">${highlight(d.n, q)}</span><span class="code">${highlight(d.c, raw)}</span></li>`;
  });
  html += '</ul>';
  results.innerHTML = html;
}

input.addEventListener('input', render);
render();
