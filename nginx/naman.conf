# Host'taki nginx: /etc/nginx/sites-available/naman.xenny.cloud
#   ln -s /etc/nginx/sites-available/naman.xenny.cloud /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Wildcard sertifika (xenny.cloud) zaten var; yenileme hook'u nginx'i reload etmeye devam eder.
# .env içindeki APP_ORIGIN bu alan adıyla (https://...) aynı olmalı.

server {
    listen 80;
    server_name naman.xenny.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name naman.xenny.cloud;

    ssl_certificate     /etc/letsencrypt/live/xenny.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xenny.cloud/privkey.pem;

    client_max_body_size 10m;

    # API doğrudan Express'e
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # istemcinin gönderdiği başlığı ezer (sahtecilik önlemi)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arayüz (kasa sayfası ve /admin) Next.js'e
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
