# Host'taki nginx: /etc/nginx/sites-available/namdoc.xenny.cloud
#   (eskisinin yedeğini alın) sonra: nginx -t && systemctl reload nginx
# namdoc.xenny.cloud artık ayrı bir site değil: naman uygulamasının herkese açık döküman sayfasıdır.
# Eski adresler çalışmaya devam eder:  https://namdoc.xenny.cloud/?v=v3
# Bu alan adında yönetim paneli (/admin) ve diğer sayfalar kapalıdır; sadece döküman ve okuma API'si açıktır.

server {
    listen 80;
    server_name namdoc.xenny.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name namdoc.xenny.cloud;

    ssl_certificate     /etc/letsencrypt/live/xenny.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xenny.cloud/privkey.pem;

    client_max_body_size 1m;

    # Ana sayfa = döküman (sorgu dizesi ?v=... korunur)
    location = / {
        proxy_pass http://127.0.0.1:3100/dokuman;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /dokuman {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Sayfanın kendi dosyaları ve robots.txt
    location /_next/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3100;
    }
    # Sadece herkese açık, salt okunur döküman API'si (girişli /api/admin, /api/me vb. bu alan adında kapalı)
    location /api/public/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { return 404; }
}
